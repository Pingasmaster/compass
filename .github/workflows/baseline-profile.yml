name: Regenerate Baseline + Startup Profile

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # JDK 25: silence JEP 498 (Unsafe) + JEP 472 (native access) warnings from
  # the Gradle client JVM and forked workers (ktlint / Kotlin compiler).
  JAVA_TOOL_OPTIONS: "--sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED"

jobs:
  baseline-profile:
    name: Generate Baseline + Startup Profile (release, Pixel 7a / API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Wrap JDK 25 for Gradle workers
        run: source scripts/ensure-jdk25-home.sh && echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV" && echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Setup GMD (Pixel 7a, API 37, 16 KB pages, arm64-v8a)
        run: >-
          ./gradlew :baselineprofile:pixel7aApi37Setup --info
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Generate Baseline + Startup Profile
        # Explicit GMD test — automaticGenerationDuringBuild is off on :app,
        # so assembleRelease alone would not collect profiles. The producer
        # variant is nonMinifiedRelease (baselineprofile plugin default).
        run: >-
          ./gradlew :baselineprofile:pixel7aApi37NonMinifiedReleaseAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=baselineprofile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Open PR with regenerated profiles
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: bot/baseline-profile-regen
          title: "chore(baseline-profile): regenerate baseline-prof.txt + startup-prof.txt"
          commit-message: "chore(baseline-profile): regenerate from API 37 / Pixel 7a"
          body: |
            Automated regeneration via the baseline-profile CI workflow.
            See app/src/release/generated/baselineProfiles/ for the diff.
          add-paths: |
            app/src/release/generated/baselineProfiles/baseline-prof.txt
            app/src/release/generated/baselineProfiles/startup-prof.txt

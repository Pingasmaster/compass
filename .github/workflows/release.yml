name: Build Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Gradle 9.6.0 introduced --non-interactive / GRADLE_NON_INTERACTIVE.
  # Prevents interactive prompts from breaking the CI build.
  GRADLE_NON_INTERACTIVE: "true"
  # NO_COLOR=1 honored by Gradle 9.6.0 — suppresses ANSI escape codes
  # while preserving bold/underline/animations. Downstream log parsing
  # and AI agent consumption benefit.
  NO_COLOR: "1"
  # JDK 25: silence JEP 498 (Unsafe) + JEP 472 (native access) warnings from
  # the Gradle client JVM and forked workers (ktlint / Kotlin compiler).
  JAVA_TOOL_OPTIONS: "--sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Wrap JDK 25 for Gradle workers
        # Worker Daemons invoke java by absolute path and skip JAVA_TOOL_OPTIONS;
        # the wrapper injects JEP 498 / JEP 472 flags for ktlint's embeddable compiler.
        run: source scripts/ensure-jdk25-home.sh && echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV" && echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build release APK
        run: ./gradlew --non-interactive assembleRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: app/build/outputs/apk/release/app-release.apk

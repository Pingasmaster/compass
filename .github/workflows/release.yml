name: Build Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Gradle 9.6.0 introduced --non-interactive / GRADLE_NON_INTERACTIVE.
  # Prevents interactive prompts from breaking the CI build.
  GRADLE_NON_INTERACTIVE: "true"
  # NO_COLOR=1 honored by Gradle 9.6.0 — suppresses ANSI escape codes
  # while preserving bold/underline/animations. Downstream log parsing
  # and AI agent consumption benefit.
  NO_COLOR: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build release APK
        run: ./gradlew --non-interactive assembleRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: app/build/outputs/apk/release/app-release.apk

name: Build Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Gradle 9.6.0 introduced --non-interactive / GRADLE_NON_INTERACTIVE.
  # Prevents interactive prompts from breaking the CI build.
  GRADLE_NON_INTERACTIVE: "true"
  # NO_COLOR=1 honored by Gradle 9.6.0 — suppresses ANSI escape codes
  # while preserving bold/underline/animations. Downstream log parsing
  # and AI agent consumption benefit.
  NO_COLOR: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # v6.1.0 was a non-existent tag; the v6 series only goes up to
        # v6.0.3 on actions/checkout. Pin to the real latest within v6
        # instead of crossing majors to v7.
        uses: actions/checkout@v6.0.3

      - name: Set up JDK 21
        # v6.0.0 was a non-existent tag; there is no v6 series on
        # actions/setup-java at all (v5.4.0 is the latest). Pin to v5.4.0
        # instead of inventing a tag that would not resolve.
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build release APK
        run: ./gradlew --non-interactive assembleRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: app/build/outputs/apk/release/app-release.apk

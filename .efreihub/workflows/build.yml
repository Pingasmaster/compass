# Forge-native CI on every push. Untrusted `run:` steps boot a Firecracker
# microVM (not Docker, not the Alpine host). `actions/checkout` is skipped
# (tree exported without `.git`). Other `uses:` fail closed.
#
# This job runs ./scripts/ci.sh: debug lints/tests/APKs, release
# lint/assemble WITH -Pcompass.requireReleaseSigning=true (no
# debug-signed release fallback), ELF check, and (when /dev/kvm is in
# the jail) shippedsmoke + smoke + hermetic e2e. ci.sh also runs
# scripts/check_ascii.sh and scripts/check_release_signing_gate.sh
# itself, so this workflow does not repeat those two checks as a
# separate step.
#
# After a green ci.sh the same guest runs ./scripts/publish_ci_release.sh:
# upload the stamped fat APKs ci.sh staged (no second assemble), next
# patch git tag, and efreihub release (compat + future). Publish only skips (exit 0) for a tag ref (avoids
# a tag-triggered publish loop) or a push to a non-default branch
# (efreihub does not inject repo secrets there). On a default-branch
# push it fails nonzero, not skip, when EFREIHUB_TOKEN or a signing
# file is missing - see scripts/publish_ci_release.sh.
#
# Guest image (`jobs.ci.guest`) is baked once (GNU libc Temurin 27 EA +
# Android SDK) and booted read-only for every run. Operator runner flag
# still needed:
#   --sandbox-share-net    Maven/Google downloads + first image bake
#
# Secrets are native efreihub repo secrets, injected only on
# default-branch job runs (see docs/release-keys.md, docs/ci.md):
#   EFREIHUB_TOKEN               env secret; write PAT for release
#                                 create/upload.
#   COMPASS_RELEASE_KEYSTORE     file secret; materialized at repo
#                                 root as release-keystore.jks.
#   COMPASS_RELEASE_PASSWORD     file secret; materialized at repo
#                                 root as .password-signing-keys.
# All three are write-only in the efreihub secret store (this repo can
# consume them, never read the values back) and are absent on
# non-default-branch pushes by design.
#
# GMD needs /dev/kvm in the guest; without it CI skips device gates.
#
# concurrency.group is a constant so a newer push cancels the in-flight job
# from the previous push (any branch).
name: ci

on: push

jobs:
  ci:
    runs-on: alpine
    concurrency:
      group: ci
      cancel-in-progress: true
    # Persist compile inputs across green default-branch runs on the runner host.
    # Fail/cancel keeps the previous green layer (n-1). Paths are /work-relative.
    # Do not cache app/build or .cxx (stale outputs mixed with sources).
    project-cache:
      - path: .gradle
        key: gradle
    guest:
      packages:
        - bash
        - unzip
        - tar
        - coreutils
        - gcompat
        - libstdc++
        - which
      jdk: "27"
      android-sdk: true
      cpus: all
      memory: 24Gi
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          set -eu
          uname -srm
          sed -n 's/^ID=//p' /etc/os-release
          test ! -f /.dockerenv
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock
          java -version
          test -x ./gradlew
          test -x ./scripts/ci.sh
          test -f ./scripts/publish_ci_release.sh

      # One guest for gate + publish: avoids a second cold Firecracker boot
      # and keeps /work handoff + Gradle/SDK caches warm.
      - name: scripts/ci.sh + publish
        run: |
          set -eu
          chmod +x ./scripts/ci.sh ./scripts/publish_ci_release.sh
          ./scripts/ci.sh
          ./scripts/publish_ci_release.sh

# Forge-native CI on every push. Untrusted `run:` steps boot a Firecracker
# microVM (not Docker, not the Alpine host). `actions/checkout` is skipped
# (tree exported without `.git`). Other `uses:` fail closed.
#
# This job runs ./scripts/ci.sh: debug lints/tests/APKs, release
# lint/assemble (without -Pcompass.requireReleaseSigning), ELF check,
# and (when /dev/kvm is in the jail) shippedsmoke + smoke + hermetic e2e.
# After a green ci.sh it runs ./scripts/publish_ci_release.sh: signed
# assemble, next patch git tag, efreihub release, and two fat APKs
# (compat + future). Publish is skipped when EFREIHUB_TOKEN is unset.
#
# Guest image (`jobs.ci.guest`) is baked once (GNU libc Temurin 27 EA + Android SDK) and
# booted read-only for every run. Operator runner flags still needed:
#   --sandbox-share-net              Maven/Google + first image bake
#   --sandbox-efreihub-token-file    write PAT (ehp_...) injected as EFREIHUB_TOKEN
#   --sandbox-efreihub-token-repo    admin/compass
# Signing: keystore files in the job workdir (or a path the guest can read).
# GMD needs /dev/kvm in the guest; without it CI skips device gates.
#
# concurrency.group is a constant so a newer push cancels the in-flight job
# from the previous push (any branch).
name: ci

on: push

jobs:
  ci:
    runs-on: alpine
    concurrency:
      group: ci
      cancel-in-progress: true
    guest:
      packages:
        - bash
        - unzip
        - tar
        - coreutils
        - gcompat
        - libstdc++
        - which
      jdk: "27"
      android-sdk: true
      cpus: all
      memory: 24Gi
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          set -eu
          uname -srm
          sed -n 's/^ID=//p' /etc/os-release
          test ! -f /.dockerenv
          test ! -e /var/run/docker.sock
          test ! -e /run/docker.sock
          java -version
          test -x ./gradlew
          test -x ./scripts/ci.sh
          test -f ./scripts/publish_ci_release.sh

      - name: ascii and signing structure
        run: |
          set -eu
          ./scripts/check_ascii.sh
          ./scripts/check_release_signing_gate.sh

      - name: scripts/ci.sh
        run: |
          set -eu
          chmod +x ./scripts/ci.sh
          ./scripts/ci.sh

      - name: publish tagged release
        run: |
          set -eu
          chmod +x ./scripts/publish_ci_release.sh
          ./scripts/publish_ci_release.sh

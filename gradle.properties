# ─────────────────────────────────────────────────────────────────────────────
# Gradle 9.6.0 modernized properties — Compass Android project
# ─────────────────────────────────────────────────────────────────────────────

# ── JVM & Daemon ─────────────────────────────────────────────────────────────
# 4g heap + G1GC + UTF-8 explicit encoding (8.9+). Daemon toolchain auto-detects
# the matching JDK for our project toolchain. persistent java compiler daemons
# are enabled by default on Linux/macOS in 8.3+.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.daemon.toolchain.enabled=true
org.gradle.java.installations.auto-detect=true
org.gradle.daemon.idletimeout=10800000
org.gradle.workers.max=4

# ── Build performance ───────────────────────────────────────────────────────
# Configuration cache (stable in 9.6.0), parallel store/load (8.11.1+),
# parallel project execution, build cache, and the file-system watching
# service (8.0+).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
org.gradle.vfs.watch=true
org.gradle.welcome=never

# ── Modernity: Kotlin DSL & feature previews ─────────────────────────────────
# Treat all build-script deprecations as errors at PR time. Catches our own
# Kotlin DSL mistakes (unused vars, deprecated APIs) and AGP/Compose/KSP
# deprecations early.
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.kotlin.dsl.skipMetadataVersionCheck=false
kotlin.code.style=official

# Surface Gradle 9.3.1+ problems report inline (deprecation, repository mode, etc).
org.gradle.warning.mode=all
org.gradle.problems.report=true

# ── AndroidX & R8 ───────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

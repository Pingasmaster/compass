# -----------------------------------------------------------------------------
# Gradle 9.6.0 modernized properties - Compass Android project
# -----------------------------------------------------------------------------

# -- JVM & Daemon -------------------------------------------------------------
# 4g heap + G1GC + UTF-8. Daemon toolchain auto-detects the matching JDK for
# our project toolchain (JDK 25 via gradle/gradle-daemon-jvm.properties).
# --sun-misc-unsafe-memory-access=allow: ktlint's embedded Kotlin compiler
# still uses sun.misc.Unsafe accessors, which JDK 25 warns about (JEP 498).
# --enable-native-access=ALL-UNNAMED: Gradle native-platform + JNI loaders
# (JEP 472); without it JDK 25 prints restricted-method warnings on every run.
# Remove once upstreams stop needing these opt-ins.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED
# Same JEP 498 / JEP 472 opt-ins for the forked Kotlin compile daemon.
kotlin.daemon.jvmargs=-Xmx2g --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED
org.gradle.daemon.toolchain.enabled=true
org.gradle.java.installations.auto-detect=true
org.gradle.daemon.idletimeout=10800000
org.gradle.workers.max=4

# -- Build performance -------------------------------------------------------
# Configuration cache (stable in 9.6.0), parallel store/load (8.11.1+),
# parallel project execution, build cache, and the file-system watching
# service (8.0+).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# parallel=true is still incubating and prints on every configure; keep the
# stable config-cache path only until Gradle promotes parallel store/load.
org.gradle.vfs.watch=true
org.gradle.welcome=never

# -- Modernity: Kotlin DSL & feature previews ---------------------------------
# Treat all build-script deprecations as errors at PR time. Catches our own
# Kotlin DSL mistakes (unused vars, deprecated APIs) and AGP/Compose/KSP
# deprecations early.
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.kotlin.dsl.skipMetadataVersionCheck=false
kotlin.code.style=official

# Surface Gradle 9.3.1+ problems report inline (deprecation, repository mode, etc).
org.gradle.warning.mode=all
org.gradle.problems.report=true

# -- AndroidX & R8 -----------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# dependency-analysis 3.18.0 declares AGP 8.10-9.2.1 as its tested range and
# warns on every configure with AGP 9.4.x. We are intentionally ahead of that
# matrix; disable the compatibility gate so configure stays clean.
dependency.analysis.compatibility=NONE

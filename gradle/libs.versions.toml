[versions]
agp = "9.2.1"
kotlin-compose = "2.3.21"
leakcanary = "2.14"

# The Compose BOM pins every androidx.compose.* artefact. The explicit
# `compose` version was removed — let the BOM be the single source of truth
# so runtime/ui/foundation/animation don't drift.
compose-bom = "2026.05.01"
material3 = "1.5.0-alpha20"
material3-adaptive = "1.3.0-beta02"
graphics-shapes = "1.1.0"

activity-compose = "1.13.0"
lifecycle = "2.11.0-beta02"

datastore = "1.3.0-alpha09"
coroutines = "1.11.0"

junit = "4.13.2"

# Static analysis toolchain.
ktlint-gradle = "14.2.0"
ktlint-engine = "1.8.0"
detekt = "2.0.0-alpha.3"
compose-rules = "0.5.9"
slack-lint-checks = "0.11.1"
slack-compose-lints = "1.4.3"
dependency-analysis = "3.13.0"

# Pin slf4j-api to 2.0.17 to avoid LinkageError with Gradle 9.4+ Tooling API.
# See https://github.com/gradle/gradle/issues/37947
slf4j = "2.0.17"

# JDK toolchain target. AGP 9.x requires JDK 17+; we use 21 to match JDK 21.
jvmTarget = "21"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3-adaptive" }
graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# Pinned slf4j-api to 2.0.17 to match Gradle 9.4+ Tooling API expectation.
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

detekt-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
lint-slack-checks = { module = "com.slack.lint:slack-lint-checks", version.ref = "slack-lint-checks" }
lint-slack-compose = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "slack-compose-lints" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-compose" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }

[versions]
agp = "9.4.0-alpha07"
desugar-jdk-libs = "2.1.5"
kotlin-compose = "2.4.20-Beta2"
leakcanary = "3.0-alpha-9"

# The Compose BOM pins every androidx.compose.* artefact. The explicit
# `compose` version was removed - let the BOM be the single source of truth
# so runtime/ui/foundation/animation don't drift.
compose-bom = "2026.06.01"
material3 = "1.5.0-alpha25"
material3-adaptive = "1.3.0-rc01"
graphics-shapes = "1.1.0"

activity-compose = "1.13.0"
lifecycle = "2.11.0"

datastore = "1.3.0-alpha10"
coroutines = "1.11.0"

junit = "4.13.2"

# Baseline Profile + Macrobenchmark toolchain.
# androidx.baselineprofile 1.4.1 was the canonical PGO plugin, but it hard-errors on
# AGP 9 (Google issue tracker b/443311090: "Module `:app` is not a supported android
# module."). The fix landed in 1.5.0-alpha01 (Dec 2025); we ship 1.5.0-beta01
# (latest), which retains AGP 9 compatibility without dropping 1.4.x CUJ scenarios.
androidx-benchmark = "1.5.0-beta01"
androidx-profileinstaller = "1.4.1"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-uiautomator = "2.4.0"
errorprone-annotations = "2.50.0"

# Static analysis toolchain.
# ktlint-engine pins the CLI used by the JDK 25 JavaExec tasks in the root
# build.gradle.kts. ktlint-gradle was removed: its process workers load
# kotlin-compiler-embeddable into the JDK 25 daemon and emit JEP 498 WARNINGs.
ktlint-engine = "1.8.0"
detekt = "2.0.0-alpha.6"
compose-rules = "0.6.4"
slack-lint-checks = "0.11.1"
slack-compose-lints = "1.5.4"
dependency-analysis = "3.18.0"

# JDK toolchain target. AGP 9.x requires JDK 17+; we build and run on JDK 25.
jvmTarget = "25"

[libraries]
# Core library desugaring (compat flavor: minSdk 26 + JVM 25 bytecode)
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar-jdk-libs" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3-adaptive" }
graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# ktlint CLI runs on a JDK 25 toolchain (see root build.gradle.kts). The
# jlleitschuh gradle plugin is intentionally unused: its workers load
# kotlin-compiler-embeddable into the JDK 25 daemon and trip JEP 498 Unsafe
# terminal-deprecation WARNINGs. The JavaExec tasks set the JEP 498 opt-in
# as jvmArgs, so the CLI itself stays quiet.
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlint-engine" }

# Baseline Profile + Macrobenchmark libraries.
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "androidx-benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone-annotations" }

leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

detekt-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
lint-slack-checks = { module = "com.slack.lint:slack-lint-checks", version.ref = "slack-lint-checks" }
lint-slack-compose = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "slack-compose-lints" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-compose" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }

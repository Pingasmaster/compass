[versions]
agp = "9.2.1"
kotlin-compose = "2.3.21"
leakcanary = "2.14"

# The Compose BOM pins every androidx.compose.* artefact. The explicit
# `compose` version was removed — let the BOM be the single source of truth
# so runtime/ui/foundation/animation don't drift.
compose-bom = "2026.05.01"
material3 = "1.5.0-alpha20"
material3-adaptive = "1.3.0-beta02"
graphics-shapes = "1.1.0"

activity-compose = "1.13.0"
lifecycle = "2.11.0-beta02"

datastore = "1.3.0-alpha09"
coroutines = "1.11.0"

junit = "4.13.2"

# Baseline Profile + Macrobenchmark toolchain.
# androidx.baselineprofile 1.4.1 was the canonical PGO plugin, but it hard-errors on
# AGP 9 (Google issue tracker b/443311090: "Module `:app` is not a supported android
# module."). The fix landed in 1.5.0-alpha01 (Dec 2025) — we ship alpha06 (May 2026,
# latest), which is the only alpha that explicitly retains the AGP 9 compatibility
# flag without removing any of the 1.4.x CUJ scenarios we exercise.
androidx-benchmark = "1.5.0-alpha06"
androidx-profileinstaller = "1.4.1"
androidx-test-ext-junit = "1.2.1"
androidx-test-uiautomator = "2.3.0"

# Static analysis toolchain.
ktlint-gradle = "14.2.0"
ktlint-engine = "1.8.0"
detekt = "2.0.0-alpha.3"
compose-rules = "0.5.9"
slack-lint-checks = "0.11.1"
slack-compose-lints = "1.4.3"
dependency-analysis = "3.13.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3-adaptive" }
graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Baseline Profile + Macrobenchmark libraries.
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "androidx-benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }

leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

detekt-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
lint-slack-checks = { module = "com.slack.lint:slack-lint-checks", version.ref = "slack-lint-checks" }
lint-slack-compose = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "slack-compose-lints" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-compose" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }
